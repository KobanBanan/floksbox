<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Каталог{% endblock %} — Floksbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      color: #1c1915;
      background: #f7f4ef;
      font: 15px/1.45 "Segoe UI", sans-serif;
    }
    .layout { display: flex; height: 100vh; }
    .side {
      width: 260px;
      flex: none;
      overflow: auto;
      background: #efeae2;
      border-right: 1px solid #e0d8cc;
      padding: 20px 12px;
    }
    .side h1 {
      margin: 4px 12px 16px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6d6458;
    }
    .side a {
      display: block;
      margin: 2px 0;
      padding: 10px 12px;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
    }
    .side a:hover { background: #e7e0d4; }
    .side a.active { background: #1c1915; color: #f7f4ef; }
    .main { flex: 1; overflow: auto; padding: 28px 36px 48px; }
    .main h2 { margin: 0; font-size: 28px; font-weight: 650; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 18px; }
    .add, button.save {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #1c1915;
      color: #f7f4ef;
      font: inherit;
      cursor: pointer;
    }
    .line {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 0 8px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e6dfd4;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
    }
    a.line:hover { border-color: #1c1915; }
    a.line strong { display: block; }
    a.line small { color: #6d6458; }
    .line-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
      color: inherit;
      text-decoration: none;
    }
    .line-main strong { display: block; }
    .line-main small { color: #6d6458; }
    .thumb, .noimg {
      width: 42px;
      height: 42px;
      flex: none;
      border-radius: 8px;
      background: #f3eee7;
      object-fit: cover;
    }
    .jumps { display: flex; gap: 6px; flex: none; }
    .jumps a {
      padding: 6px 10px;
      border-radius: 8px;
      background: #f3eee7;
      color: inherit;
      text-decoration: none;
    }
    .jumps a:hover { background: #e7e0d4; }
    .jumps a.on { background: #1c1915; color: #f7f4ef; }
    .back { color: #6d6458; text-decoration: none; }
    .back:hover { color: #1c1915; }
    .panel {
      max-width: 560px;
      margin-top: 18px;
      padding: 16px;
      background: #fff;
      border: 1px solid #e6dfd4;
      border-radius: 12px;
    }
    .panel label { display: block; margin: 0 0 12px; color: #4a433a; }
    .panel label span { display: block; margin-bottom: 4px; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      border: 1px solid #e0d8cc;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      color: inherit;
      background: #fff;
    }
    textarea { min-height: 140px; resize: vertical; }
    .sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .note { margin: 0 0 14px; color: #6d6458; }
    .status { margin: 8px 0 0; min-height: 1.2em; font-size: 13px; color: #2f6b3a; }
    .status.bad { color: #8a2e2e; }
    label.flag { display: flex; align-items: center; gap: 8px; color: #4a433a; flex: none; }
    .remove {
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 6px 10px;
      background: #fff;
      color: #b91c1c;
      font: inherit;
      cursor: pointer;
      flex: none;
    }
    .photos { display: flex; gap: 8px; align-items: center; overflow-x: auto; min-height: 96px; }
    .shot {
      position: relative;
      width: 96px;
      height: 96px;
      flex: none;
      border-radius: 10px;
      overflow: hidden;
      background: #faf8f5;
      border: 1px solid #e6dfd4;
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shot .x {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: rgba(28, 25, 21, 0.78);
      color: #fff;
      cursor: pointer;
      line-height: 22px;
      padding: 0;
    }
    .drop {
      width: 96px;
      height: 96px;
      flex: none;
      border: 1.5px dashed #c9bfb0;
      border-radius: 10px;
      background: #faf8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6d6458;
      font-size: 28px;
      cursor: pointer;
    }
    .drop.over { border-color: #1c1915; background: #f0ebe3; }
    .drop input { display: none; }
    .empty { color: #6d6458; }
  </style>
</head>
<body>
  {% csrf_token %}
  <div class="layout">
    <aside class="side">
      <h1>Разделы</h1>
      {% for item in categories %}
        <a href="/desk/?category={{ item.id }}" class="{% if category and item.id == category.id %}active{% endif %}">{{ item.name }}</a>
      {% empty %}
        <p class="empty">Разделов нет</p>
      {% endfor %}
    </aside>
    <main class="main">
      {% block main %}{% endblock %}
    </main>
  </div>
  {% block script %}{% endblock %}
</body>
</html>
